name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check JavaScript syntax
        run: find public server tests -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
      - name: Build native helper without microphone access
        if: runner.os == 'macOS'
        run: npm run setup:voice
      - name: Build and verify Apple Silicon distribution
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          bash scripts/package-macos.sh
          PARLIBOT_PACKAGE_TESTS=1 node --test tests/packaging.test.js
